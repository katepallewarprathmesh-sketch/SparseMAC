name: CI
on: [push, pull_request]
jobs:
  trackb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y verilator iverilog yosys python3-pip
          pip install cocotb==1.9.2 numpy matplotlib
      - name: Lint + smoke regression
        run: make test
